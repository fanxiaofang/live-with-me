<!doctype html>
<html>
  <head><meta charset="utf-8"><title>Sandboxed preview regression</title></head>
  <body>
    <iframe id="preview" sandbox="allow-scripts allow-same-origin allow-downloads" style="position:fixed;inset:0;width:100%;height:100%;border:0"></iframe>
    <script>
      const target = new URL('/', location.href);
      target.hostname = 'localhost';
      document.getElementById('preview').src = target.href;
    </script>
  </body>
</html>
